schemaVersion: 1
app:
  id: auraboot-core-only
  name: AuraBoot Core Only
  version: 1.0.0
  defaultRoute: /admin
platform:
  runtime: 1.0.0
  baseImage:
    id: auraboot-runtime
    version: 1.0.0
  pluginApi: 1.0.0
  webShell: 1.0.0
  pluginSdk: 0.0.1
  webPackages:
    - package: "@auraboot/dsl-types"
      version: 0.0.1
    - package: "@auraboot/nav-model"
      version: 0.0.1
    - package: "@auraboot/ui"
      version: 1.0.0
    - package: "@auraboot/dsl-runtime"
      version: 1.0.0
    - package: "@auraboot/designer-sdk"
      version: 1.0.0
    - package: "@auraboot/web-testkit"
      version: 1.0.0
  dslSchema: 4
backend:
  mode: core-only
  plugins: []
  migrationSets:
    - core
frontend:
  contributions: []
config:
  importOrder:
    - core-meta
    - platform-admin
    - org-management
    - core-ownership
