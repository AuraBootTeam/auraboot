services:
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "19093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    depends_on:
      - observability-canary-receiver
    restart: unless-stopped

  observability-canary-receiver:
    image: python:3.12-alpine
    ports:
      - "18080:8080"
    volumes:
      - ./docker/observability-canary/receiver.py:/app/receiver.py:ro
      - observability_canary_data:/data
    command: ["python", "/app/receiver.py"]
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "19091:9091"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    ports:
      - "13100:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ['-config.file=/etc/loki/local-config.yaml']
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    ports:
      - "13200:3200"
      - "19411:9411"
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ['-config.file=/etc/tempo/tempo.yml']
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-auraboot-observability-ci}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  # macOS incompatible — requires /proc and /sys from Linux kernel
  # Enable with: --profile linux
  node-exporter:
    image: prom/node-exporter:v1.8.0
    profiles:
      - linux
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://ghj@host.docker.internal:5432/aura_boot?sslmode=disable"
    restart: unless-stopped

  # macOS incompatible — requires privileged access to /sys and Docker socket on Linux
  # Enable with: --profile linux
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles:
      - linux
    ports:
      - "8080:8080"
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  # Optional: containerized PostgreSQL with pg_stat_statements enabled
  # Enable with: --profile db
  postgres:
    image: postgres:16-alpine
    profiles:
      - db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ghj
      POSTGRES_DB: aura_boot
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.56
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  observability_canary_data:
  loki_data:
  tempo_data:
