[tool.poetry]
name = "airflow-provider-auraboot"
version = "0.1.0"
description = "Apache Airflow provider for AuraBoot — operators, sensors, hooks"
authors = ["AuraBoot Team <ops@auraboot.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "airflow_provider_auraboot", from = "src"}]

[tool.poetry.dependencies]
# Patched dnspython requires Python 3.11+. Keep Airflow's Python 3.15 exclusion
# in PEP 440 form for dependency and vulnerability tooling.
python = ">=3.11,!=3.15,<4.0"
apache-airflow = ">=3.3.0,<4.0"
requests = "^2.31"
dnspython = ">=2.9.0,<3.0"
# Security floor for bounded W3C trace-context parsing.
opentelemetry-api = ">=1.45.2,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.12"
responses = "^0.25"             # for HTTP cassette
pendulum = ">=2.1.2,<4.0"       # transitive dep of apache-airflow; pin explicitly for test env
pandas = ">=2.2,<3"

[tool.poetry.plugins."apache_airflow_provider"]
provider_info = "airflow_provider_auraboot.__init__:get_provider_info"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
