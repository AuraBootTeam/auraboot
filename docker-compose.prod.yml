# AuraBoot — Production Deployment
# Uses pre-built Docker images from GHCR.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars (set in .env or export; the two secrets fail fast if unset):
#   REGISTRY          — e.g. ghcr.io/aurabootteam
#   TAG               — e.g. latest, v1.0.0, main, or a commit sha
#   POSTGRES_PASSWORD — PostgreSQL password (no default in prod)
#   JWT_SECRET        — JWT signing secret, min 32 chars (openssl rand -hex 32)
#
# Resource limits below are conservative defaults for a small single host
# (backend heap is capped at -Xmx1024m); tune per deployment.

services:
  backend:
    image: ${REGISTRY:-ghcr.io/aurabootteam}/auraboot:${TAG:-latest}
    container_name: auraboot-backend
    restart: unless-stopped
    # 2g for a 1g heap: metaspace, thread stacks, direct/mapped buffers headroom.
    mem_limit: 2g
    cpus: "2"
    ports:
      - "6443:6443"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aura_boot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-auraboot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production deployments}
      # Boot 3 binds spring.data.redis.* — SPRING_REDIS_* is silently ignored.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Required: without it the stack inherits the local-eval default, which the
      # app-side guard does not recognize, so a weak secret would boot in prod.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for production deployments (min 32 chars, openssl rand -hex 32)}
      OPEN_PLATFORM_PROTOCOL_SIGNING_KEY: ${OPEN_PLATFORM_PROTOCOL_SIGNING_KEY:?OPEN_PLATFORM_PROTOCOL_SIGNING_KEY is required for production deployments (openssl rand -hex 32)}
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
            # Default-deny authorization knob (PermissionInterceptor un-annotated surface,
      # shipped deny since the authz flip); ops can override to shadow/allow per
      # deployment without an image rebuild. See aura.security.authz.unannotated-mode.
      AURA_AUTHZ_UNANNOTATED_MODE: ${AURA_AUTHZ_UNANNOTATED_MODE:-deny}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["cmd", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6443/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Base services, overridden here only to add resource limits (compose merges
  # the rest — image, healthcheck, volumes, ports — from docker-compose.yml).
  postgres:
    mem_limit: 1g
    cpus: "2"

  redis:
    mem_limit: 512m
    cpus: "1"

  frontend:
    image: ${REGISTRY:-ghcr.io/aurabootteam}/auraboot-frontend:${TAG:-latest}
    container_name: auraboot-frontend
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SPRING_BOOT_URL: http://backend:6443
      # SSR data loaders (root.tsx getUserInfo/getUserMenus/fetchSpaces, form.ts,
      # URLBuilder.ts) reach the backend via BFF_INTERNAL_URL, NOT SPRING_BOOT_URL.
      # Left unset it defaults to 127.0.0.1:6443 — wrong inside the frontend
      # container — so authenticated SSR pages bounce back to /login.
      BFF_INTERNAL_URL: http://backend:6443
      BFF_PORT: "3000"
      ICP_COMPLIANCE_ENABLED: ${ICP_COMPLIANCE_ENABLED:-0}
      ICP_SITE_TITLE: ${ICP_SITE_TITLE:-}
      ICP_RECORD_NUMBER: ${ICP_RECORD_NUMBER:-}
    depends_on:
      backend:
        condition: service_healthy
