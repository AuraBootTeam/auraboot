# Linux CI only: provision runtime-owned ports and a blank PostgreSQL database. The backend
# integration runner applies the canonical Flyway migrations after PostgreSQL
# is healthy so both schema and migration-owned platform seed rows are tested.
services:
  postgres:
    container_name: ${AURA_OSS_CI_POSTGRES_CONTAINER:?CI PostgreSQL container identity is required}
    ports: !override
      - "${AURA_OSS_CI_POSTGRES_PORT:?CI PostgreSQL port is required}:5432"
    environment:
      POSTGRES_DB: aura_boot
      POSTGRES_USER: auraboot
      POSTGRES_PASSWORD: auraboot_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auraboot -d aura_boot"]
    volumes: !override
      - skills_c2_postgres_data:/var/lib/postgresql/data

  redis:
    container_name: ${AURA_OSS_CI_REDIS_CONTAINER:?CI Redis container identity is required}
    ports: !override
      - "${AURA_OSS_CI_REDIS_PORT:?CI Redis port is required}:6379"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "${AURA_OSS_CI_KAFKA_PORT:-9092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${AURA_OSS_CI_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  skills_c2_postgres_data:
    driver: local
