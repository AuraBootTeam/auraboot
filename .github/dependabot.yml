# Dependabot configuration for AuraBoot OSS
# Reduces time-to-patch on third-party CVEs without flooding the team.
# Tune after launch — first month we may want fewer auto-PRs.

version: 2

updates:
  # Backend (Gradle)
  - package-ecosystem: "gradle"
    directory: "/platform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 8
    groups:
      spring:
        patterns:
          - "org.springframework*"
      mybatis-plus:
        patterns:
          - "com.baomidou:*"
      serialization:
        patterns:
          - "com.fasterxml.jackson.*:*"
          - "org.apache.avro:avro"
      messaging:
        patterns:
          - "org.apache.kafka:kafka-clients"
          - "com.rabbitmq:amqp-client"
      cloud-storage:
        patterns:
          - "io.minio:minio"
          - "software.amazon.awssdk:*"
      backend-test-tooling:
        patterns:
          - "org.junit:junit-bom"
          - "org.assertj:assertj-core"
          - "com.tngtech.archunit:archunit-junit5"
          - "org.jacoco:org.jacoco.ant"
      backend-integrations:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "area: backend"
    commit-message:
      prefix: "chore(deps-backend)"
    # Don't auto-bump major versions — those usually need code changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 3.5.17 no longer exposes the extension API through the current starter
      # classpath. Keep later versions eligible for a dedicated migration.
      - dependency-name: "com.baomidou:*"
        versions: ["3.5.17"]

  # Frontend (pnpm)
  - package-ecosystem: "npm"
    # pnpm-lock.yaml lives at the repository root. Scanning /web-admin updates
    # package.json without the workspace lockfile and creates born-red PRs.
    directory: "/"
    schedule:
      interval: "monthly"
    # Pause aggregate npm version-update PRs until runtime and development
    # dependencies are split into independently testable framework families.
    # Dependabot security alerts and security updates remain enabled separately.
    open-pull-requests-limit: 0
    groups:
      frontend-runtime:
        dependency-type: "production"
        patterns:
          - "*"
      frontend-development:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "area: frontend"
    commit-message:
      prefix: "chore(deps-frontend)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/platform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "area: devops"
    commit-message:
      prefix: "chore(deps-docker)"

  - package-ecosystem: "docker"
    directory: "/web-admin"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "area: devops"
    commit-message:
      prefix: "chore(deps-docker)"
