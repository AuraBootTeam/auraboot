name: Backend CI

on:
  push:
    branches: [main]
  # Backend contracts must also execute on stacked feature PRs.
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Lint & Compile (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        java: ['21']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 "$head" | tail -1)"
            fi
          fi

          if git diff --name-only "$base" "$head" \
            | grep -E '^(platform/|scripts/fixtures/agent-artifact-consumer/|\.github/workflows/backend\.yml)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes; required check reports success without running Gradle."
          fi

      - name: Set up JDK ${{ matrix.java }}
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        if: steps.changes.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: chmod +x ./gradlew

      # Schema validity is enforced by the schema-flyway workflow, which runs
      # flyway-validate + check-schema-drift (migrations are the source of truth
      # and db/snapshots/schema-current.sql is the generated bring-up artifact).
      # There is no hand-written schema.sql to syntax-check here anymore.

      - name: Compile (main + test sources)
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Verify application assemblies, discovery and launcher modes
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: >-
          ./gradlew --no-daemon :platform-app:test
          --tests com.auraboot.framework.application.PlatformApplicationModeTest
          --tests com.auraboot.framework.application.AgentAssemblyVerifierTest
          --tests com.auraboot.framework.application.ApplicationCapabilitiesControllerTest
          :platform-app:verifyBaseApplicationAssembly

      - name: Verify core agent implementation boundary
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: >-
          ./gradlew --no-daemon :test
          --tests com.auraboot.framework.architecture.CoreAgentBoundaryTest
          --tests com.auraboot.framework.plugin.service.impl.PluginOptionalAgentCapabilityTest
          --max-workers=2 -PauraTestMaxHeap=2g -PauraTestMinHeap=256m

      - name: Upload core agent boundary results
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: core-agent-boundary-java-${{ matrix.java }}-${{ github.run_attempt }}
          path: platform/build/test-results/test/TEST-com.auraboot.framework.architecture.CoreAgentBoundaryTest.xml
          if-no-files-found: warn

      - name: Verify isolated core agent app publications
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/agent-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          repository="$evidence/maven"
          consumer="$evidence/consumer"
          version="$(tr -d '\r\n' < ../VERSION)-ci.${GITHUB_SHA}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          test ! -e "$evidence"
          mkdir -p "$repository" "$consumer/src/main/java"
          echo "AGENT_PUBLICATION_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          cp ../scripts/fixtures/agent-artifact-consumer/settings.gradle "$consumer/"
          cp ../scripts/fixtures/agent-artifact-consumer/build.gradle "$consumer/"
          cp ../scripts/fixtures/agent-artifact-consumer/src/main/java/PublishedArtifactProbe.java "$consumer/src/main/java/"
          ./gradlew --no-daemon "-Dmaven.repo.local=$repository" "-PauraPlatformVersion=$version" \
            :publishMavenJavaPublicationToMavenLocal \
            :platform-plugin-api:publishMavenJavaPublicationToMavenLocal \
            :platform-agent:publishMavenJavaPublicationToMavenLocal \
            :platform-app:publishMavenJavaPublicationToMavenLocal \
            :platform-bom:publishMavenJavaPublicationToMavenLocal \
            :platform-storage-minio:publishMavenJavaPublicationToMavenLocal \
            :platform-storage-s3:publishMavenJavaPublicationToMavenLocal \
            :platform-storage-oss:publishMavenJavaPublicationToMavenLocal \
            :platform-storage-cos:publishMavenJavaPublicationToMavenLocal \
            :platform-mq-kafka:publishMavenJavaPublicationToMavenLocal 2>&1 | tee "$evidence/producer.log"
          for metadata in module pom; do
            ./gradlew --no-daemon --project-dir "$consumer" "-Dmaven.repo.local=$repository" \
              "-PpublicationRepository=$repository" "-PpublicationVersion=$version" \
              "-PpublicationMetadata=$metadata" verifyPublishedArtifacts \
              2>&1 | tee "$evidence/consumer-$metadata.log"
          done

      - name: Retain published consumer evidence
        if: always() && steps.changes.outputs.run == 'true' && env.AGENT_PUBLICATION_EVIDENCE != ''
        uses: actions/upload-artifact@v7
        with:
          name: agent-publication-java-${{ matrix.java }}-${{ github.run_attempt }}
          path: |
            ${{ env.AGENT_PUBLICATION_EVIDENCE }}/producer.log
            ${{ env.AGENT_PUBLICATION_EVIDENCE }}/consumer-*.log
          if-no-files-found: warn

      # Phase 2.1 IT scaffolding: compile-only gate ensures IT sources stay
      # green even though we don't run the suite in CI yet (running requires
      # a seeded Postgres — schema init script is Phase 2.2 backlog).
      - name: Compile (integrationTest sources)
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: ./gradlew --no-daemon :platform-app:compileIntegrationTestJava

      - name: Checkstyle (main)
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: ./gradlew --no-daemon checkstyleMain

      - name: PMD (main)
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: ./gradlew --no-daemon pmdMain

      - name: Assemble jar
        if: steps.changes.outputs.run == 'true'
        working-directory: platform
        run: ./gradlew --no-daemon jar

      - name: Upload quality reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            platform/build/reports/checkstyle/
            platform/build/reports/pmd/
          if-no-files-found: ignore
          retention-days: 7
