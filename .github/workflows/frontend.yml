name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'web-admin/**'
      - 'plugins/cli/**'
      - 'plugins/schemas/plugin-manifest.schema.json'
      - 'scripts/import-plugins.sh'
      - 'scripts/dev/plugin-assembly*'
      - 'contracts/internal-web-admin/**'
      - 'scripts/internal-api/**'
      - 'platform/src/main/java/**'
      - 'platform/platform-agent/src/main/java/**'
      - 'platform/platform-app/src/main/java/**'
      - 'platform/src/main/resources/**'
      - 'platform/platform-agent/src/main/resources/**'
      - 'platform/platform-app/src/main/resources/**'
      - 'platform/build.gradle'
      - 'packages/**'
      - 'plugins/**/config/dashboards/**'
      - 'plugins/schemas/dashboards.schema.json'
      - 'scripts/validate-plugin-dashboards.mjs'
      - 'scripts/oss-specialized-profiles.test.mjs'
      - 'oss-scope.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-admin/**'
      - 'plugins/cli/**'
      - 'plugins/schemas/plugin-manifest.schema.json'
      - 'scripts/import-plugins.sh'
      - 'scripts/dev/plugin-assembly*'
      - 'contracts/internal-web-admin/**'
      - 'scripts/internal-api/**'
      - 'platform/src/main/java/**'
      - 'platform/platform-agent/src/main/java/**'
      - 'platform/platform-app/src/main/java/**'
      - 'platform/src/main/resources/**'
      - 'platform/platform-agent/src/main/resources/**'
      - 'platform/platform-app/src/main/resources/**'
      - 'platform/build.gradle'
      - 'packages/**'
      - 'plugins/**/config/dashboards/**'
      - 'plugins/schemas/dashboards.schema.json'
      - 'scripts/validate-plugin-dashboards.mjs'
      - 'scripts/oss-specialized-profiles.test.mjs'
      - 'oss-scope.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint / Type-check / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked internal API toolchain
        run: npm ci --prefix scripts/internal-api/toolchain --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=registry.npmmirror.com

      - name: Internal API snapshot and generated type gate
        run: node scripts/internal-api/foundation.mjs --evidence "$RUNNER_TEMP/internal-api-foundation"

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Lint web-admin
        working-directory: web-admin
        run: pnpm lint

      - name: Test environment contract
        working-directory: web-admin
        run: node --test scripts/test-environments.test.mjs

      - name: Env-drift gate (tests/)
        working-directory: web-admin
        run: pnpm test:env-lint

      - name: Type-check web-admin
        working-directory: web-admin
        run: pnpm typecheck

      - name: CLI capability and MCP regression
        working-directory: plugins/cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test

      - name: Optional plugin assembly contract
        run: node --test scripts/dev/plugin-assembly.test.mjs

      - name: Unit tests (vitest)
        working-directory: web-admin
        run: pnpm test:unit

      - name: Validate dashboard contracts
        run: node scripts/validate-plugin-dashboards.mjs

      - name: Validate E2E profile collection and prerequisites
        run: node --test scripts/oss-specialized-profiles.test.mjs

      - name: Retain internal API consistency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: internal-api-foundation
          path: ${{ runner.temp }}/internal-api-foundation
          if-no-files-found: ignore
