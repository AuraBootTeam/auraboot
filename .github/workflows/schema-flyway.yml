# Flyway schema gate (OSS core): validate + fresh migrate + snapshot drift on
# PostgreSQL + pgvector. End-state spec §3.6 / P3 CI.
#
# NOTE: GitHub Actions is enabled for this repository (2026-10-18). This gate
# runs on demand via workflow_dispatch; local verification remains available
# via:
#   scripts/db/flyway-validate.sh --edition oss
#   scripts/db/check-schema-drift.sh --edition oss
name: schema-flyway

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'platform/src/main/resources/db/migration/**'
      - 'platform/src/main/resources/db/snapshots/**'
      - 'scripts/db/**'
      - '.github/workflows/schema-flyway.yml'
  pull_request:
    paths:
      - 'platform/src/main/resources/db/migration/**'
      - 'platform/src/main/resources/db/snapshots/**'
      - 'scripts/db/**'

jobs:
  flyway-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auraboot
          POSTGRES_PASSWORD: auraboot
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auraboot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: auraboot
      PG_PASSWORD: auraboot
      FLYWAY_VERSION: "11.2.0"
    steps:
      - uses: actions/checkout@v7

      # The fresh-database steps below apply a lower version in order and cannot
      # see it; preserved databases reject the upgrade instead (#2550).
      - name: Migrations added by this change are newer than the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          scripts/db/check-migration-order-vs-base.sh FETCH_HEAD

      - name: Install Flyway CLI
        run: |
          set -euo pipefail
          url="https://repo.maven.apache.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz"
          curl -fsSL "$url" -o /tmp/flyway.tgz
          sudo mkdir -p /opt/flyway
          sudo tar -xzf /tmp/flyway.tgz -C /opt/flyway --strip-components=1
          sudo chmod +x /opt/flyway/flyway
          echo "/opt/flyway" >> "$GITHUB_PATH"

      - name: Fresh database
        run: |
          PGPASSWORD=auraboot psql -h localhost -U auraboot -d postgres -c "CREATE DATABASE aura_ci_core;"

      - name: Flyway migrate (core, fresh DB)
        run: PG_DB=aura_ci_core scripts/db/flyway-migrate.sh --edition oss

      - name: Flyway validate
        run: PG_DB=aura_ci_core scripts/db/flyway-validate.sh --edition oss

      - name: Schema snapshot drift
        run: PG_DB=aura_ci_core scripts/db/check-schema-drift.sh --edition oss
