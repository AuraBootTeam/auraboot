name: Docker Quickstart

# Smoke-tests the README's `docker compose --profile full up --build -d` path
# end-to-end on every main push and relevant PR. Catches the class of breakage that hid silently for
# 8 weeks because frontend.yml/build-image.yml never started the stack and
# Playwright defaults to the Vite dev server (:5173) rather than the BFF/SSR
# entrypoint (:3000) the public docs recommend.
#
# What this guards against (in order of likelihood):
#   1. pnpm-lock.yaml drift after dependabot package.json bumps
#   2. Dockerfile base image / Gradle / toolchain mismatch
#   3. docker-compose env-var omissions that crash a container
#   4. BFF / react-router build-mode mismatch (e.g. import path drift,
#      future bumps that change unstable_* exports)
#   5. backend bootstrap regressions that stop the stack from going healthy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quickstart:
    name: docker compose --profile full + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AURA_GRADLE_REPOSITORY_POLICY: central
      MAVEN_CENTRAL_FIRST: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Docker quickstart changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          # A main commit is the release candidate, so it must never inherit a
          # path-filtered green result. Manual dispatch is likewise an explicit
          # request for the real gate. Only PRs may use change detection.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          if git diff --name-only "$base" "$head" \
            | grep -E '^(platform/|contracts/internal-web-admin/|scripts/internal-api/|scripts/ci/gradle-repositories\.init\.gradle|docker-compose(\..*)?\.yml|platform/Dockerfile|web-admin/Dockerfile|web-admin/app/server/|web-admin/package\.json|pnpm-lock\.yaml|platform/build\.gradle|platform/gradle/wrapper/|plugins/|scripts/quickstart\.sh|scripts/prepare-quickstart-env(\.test)?\.py|\.env\.example|scripts/docker-bootstrap\.sh|scripts/dev/plugin-import-profiles\.json|scripts/dev/verify-quickstart\.sh|\.github/workflows/quickstart\.yml)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Docker quickstart changes; required check reports success without starting compose."
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Prepare private protocol signing key
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import os
          import secrets
          with os.fdopen(os.open('.env', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as output:
              output.write('OPEN_PLATFORM_PROTOCOL_SIGNING_KEY=' + secrets.token_hex(48) + '\n')
          PY

      - name: Build & start full stack
        if: steps.changes.outputs.run == 'true'
        run: docker compose --profile full up --build -d

      - name: Set up Node.js for contract comparison
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Wait for backend healthy
        if: steps.changes.outputs.run == 'true'
        # Backend port 6443 is intentionally not exposed to host; we hit it
        # through the docker network via `docker compose exec`.
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T backend wget -q --spider http://localhost:6443/actuator/health 2>/dev/null; then
              echo "backend healthy after ${i}×3s"
              exit 0
            fi
            sleep 3
          done
          echo "backend never came up after 180s"
          docker compose logs --tail 200 backend
          exit 1

      - name: Frontend reachable on host port 3000
        if: steps.changes.outputs.run == 'true'
        # The README sends users to localhost:3000; assert it serves something
        # other than the SPA-fallback 500 we've been silently shipping.
        run: |
          # Root is expected to redirect to /login (auth-gated). Either 200 or
          # 302 is acceptable here; only 500/connection-refused is a failure.
          status="000"
          curl_exit=0
          for i in $(seq 1 20); do
            set +e
            status=$(curl -sS -o /tmp/root.html -w "%{http_code}" -m 15 http://localhost:3000/)
            curl_exit=$?
            set -e
            echo "GET / attempt ${i}: status=${status} curl_exit=${curl_exit}"
            if [ "$curl_exit" = "0" ] && [ "$status" != "500" ] && [ "$status" != "000" ]; then
              exit 0
            fi
            sleep 3
          done

          echo "frontend is broken after retries - first 100 lines of body:"
          head -100 /tmp/root.html || true
          echo "--- compose ps ---"
          docker compose ps
          echo "--- frontend logs ---"
          docker compose logs --tail 200 frontend
          echo "--- backend logs ---"
          docker compose logs --tail 100 backend
          exit 1

      - name: Bootstrap + import plugins — via the script users actually run
        if: steps.changes.outputs.run == 'true'
        # This step used to inline its own curl to /api/bootstrap/setup. It passed,
        # and it was validating a path no user follows: the README's steps PLUS one
        # the README never mentioned. The onboarding was broken for months and this
        # gate could not see it, because it silently did the missing step itself.
        #
        # Run what we ship. If scripts/quickstart.sh breaks, the quickstart breaks,
        # and this goes red.
        run: ./scripts/quickstart.sh

      - name: Internal contract capture and cleanup self-tests
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/ci/capture-internal-document.test.py

      - name: Internal API contract drift from the built backend
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/internal-api-live"
          # Community keeps documentation authenticated; use the just-provisioned admin.
          token=$(curl -fsS -m 10 -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@auraboot.com","password":"Test2026x"}' \
            | python3 -c 'import json,re,sys; token=json.load(sys.stdin).get("data", {}).get("jwt"); assert isinstance(token,str) and re.fullmatch(r"[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+",token), "Missing session token"; print(token)')
          echo "::add-mask::$token"
          # Revoke only this capture's session, including when the drift gate fails.
          capture_session_cleanup() {
            local original_status=$?
            trap - EXIT
            curl -fsS -m 15 -X DELETE http://localhost:3000/api/user/sessions/current \
              -H "Authorization: Bearer $token" -H "Origin: http://localhost:3000" \
              > /dev/null || exit 1
            local identity_status
            identity_status=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' \
              http://localhost:3000/api/auth/me -H "Authorization: Bearer $token") || exit 1
            [[ "$identity_status" == 401 ]] || { echo "Capture session remained authorized" >&2; exit 1; }
            printf '%s\n' '{"claim":"capture-session-cleanup-only","sessionRevoked":true,"identityAfterRevocation":401}' \
              > "$RUNNER_TEMP/internal-api-live/session-cleanup.json"
            exit "$original_status"
          }
          trap capture_session_cleanup EXIT
          printf '%s\n' "$token" | docker compose exec -T backend sh -c '
            IFS= read -r token
            exec wget -q -O - --header="Authorization: Bearer $token" \
              http://localhost:6443/v3/api-docs/internal-web-admin
          ' > "$RUNNER_TEMP/internal-api-live/openapi.json"
          node scripts/internal-api/drift.mjs "$RUNNER_TEMP/internal-api-live/openapi.json" \
            "$RUNNER_TEMP/internal-api-live/drift-receipt.json"

      - name: The platform is not empty
        if: steps.changes.outputs.run == 'true'
        # Health is UP and login works on a platform with zero models and zero
        # menus — which is what you get if plugin import silently fails. Assert
        # the user lands on something usable, not just something that boots.
        run: |
          token=$(curl -fsS -m 10 -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@auraboot.com","password":"Test2026x"}' \
            | sed -n 's/.*"jwt":"\([^"]*\)".*/\1/p')
          [ -n "$token" ] || { echo "no token"; exit 1; }

          menus=$(curl -fsS -m 10 -H "Authorization: Bearer $token" \
            http://localhost:3000/api/menu/user | grep -o '"path"' | wc -l | tr -d ' ')
          echo "menu entries: $menus"
          [ "$menus" -ge 20 ] || {
            echo "the sidebar would be empty or near-empty — plugin import did not land"
            docker compose logs --tail 100 backend
            exit 1
          }

      - name: Login API contract via BFF proxy
        if: steps.changes.outputs.run == 'true'
        # End-to-end smoke: BFF /api/* proxy + backend /api/auth/login + the
        # bootstrap-seeded admin credentials all aligned.
        run: |
          response=$(curl -fsS -m 10 -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@auraboot.com","password":"Test2026x"}')
          printf '%s' "$response" | python3 -c 'import json,sys; token=json.load(sys.stdin).get("data", {}).get("jwt"); assert isinstance(token, str) and token, "Login did not return a session token"' || {
            echo "login did not return a JWT"
            docker compose logs --tail 100 backend
            docker compose logs --tail 100 frontend
            exit 1
          }

      - name: Authenticated API smoke (real endpoints)
        if: steps.changes.outputs.run == 'true'
        run: |
          token=$(AURA_CORE_BASE_URL=http://localhost:3000 \
            ADMIN_EMAIL=admin@auraboot.com ADMIN_PASSWORD=Test2026x \
            python3 scripts/application/core-admin-session.py)
          [ -n "$token" ] || { echo "no token"; exit 1; }
          # Stick to endpoints that any authenticated user can hit without
          # specific permission grants — the smoke test asserts BFF proxy +
          # backend auth + dispatch all work, not RBAC semantics. The earlier
          # /api/menu and /api/permissions choices were wrong: their root
          # paths have no GET handler (500), and /api/permissions/tree
          # requires a specific permission code (403 even for admin).
          for ep in /api/auth/me /api/menu/user; do
            curl -fsS -m 10 -H "Authorization: Bearer $token" \
              "http://localhost:3000$ep" -o /dev/null \
              && echo "$ep → 200" \
              || { echo "$ep failed"; exit 1; }
          done

      - name: Failure diagnostics
        if: failure() && steps.changes.outputs.run == 'true'
        run: |
          echo "--- compose ps ---"
          docker compose ps
          echo "--- backend logs ---"
          docker compose logs --tail 200 backend
          echo "--- frontend logs ---"
          docker compose logs --tail 100 frontend

      - name: Tear down
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose --profile full down -v

      - name: Retain observed internal API contract
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: internal-api-live
          path: ${{ runner.temp }}/internal-api-live
          if-no-files-found: ignore
