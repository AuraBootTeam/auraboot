name: Controller Authz Fail-Open Gate

# Permission decisions are required per handler, including reads and admin routes.
# The zero baseline must stay closed; scanner fixtures run before the repository audit.

on:
  push:
    branches: [main]
    paths:
      - 'platform/src/main/java/**/*Controller.java'
      - 'platform/platform-agent/src/main/java/**/*Controller.java'
      - 'platform/platform-app/src/main/java/**/*Controller.java'
      - 'scripts/check-controller-authz.mjs'
      - 'scripts/check-controller-authz.test.mjs'
      - 'scripts/controller-authz-baseline.json'
      - '.github/workflows/controller-authz.yml'
  pull_request:
    branches: [main]
    paths:
      - 'platform/src/main/java/**/*Controller.java'
      - 'platform/platform-agent/src/main/java/**/*Controller.java'
      - 'platform/platform-app/src/main/java/**/*Controller.java'
      - 'scripts/check-controller-authz.mjs'
      - 'scripts/check-controller-authz.test.mjs'
      - 'scripts/controller-authz-baseline.json'
      - '.github/workflows/controller-authz.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-authz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Controller authz fail-open ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify authorization scanner boundaries
        run: node --test scripts/check-controller-authz.test.mjs

      - name: Check every mapped handler for an authorization decision
        run: node scripts/check-controller-authz.mjs
