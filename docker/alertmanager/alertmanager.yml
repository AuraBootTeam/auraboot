route:
  receiver: auraboot-observability-canary
  group_by: [alertname, acceptance]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: auraboot-observability-canary
    webhook_configs:
      - url: http://observability-canary-receiver:8080/alerts
        send_resolved: true
