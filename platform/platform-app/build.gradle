import java.util.jar.Manifest
import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.auraboot'

apply from: rootProject.file('gradle/platform-quality.gradle')
repositories {
    mavenCentral()
    maven { url = 'https://maven.aliyun.com/repository/public' }
}
apply from: rootProject.file('gradle/platform-dependency-management.gradle')

// A consuming BOM overrides explicit transitive versions. Preserve the previous full
// application's resolved production versions rather than changing them during assembly.
dependencyManagement {
    dependencies {
        dependency 'com.github.ben-manes.caffeine:caffeine:3.3.0'
        dependency 'com.google.http-client:google-http-client-jackson2:1.47.1'
        dependency 'io.netty:netty-resolver-dns-native-macos:4.1.107.Final'
        dependency 'org.postgresql:postgresql:42.7.13'
        dependency 'org.checkerframework:checker-qual:3.55.1'
    }
}

dependencies {
    implementation project(':')
    implementation 'org.springframework.boot:spring-boot'
    runtimeOnly project(':platform-agent')
    runtimeOnly project(':platform-mq-kafka')
    runtimeOnly project(':platform-storage-minio')
    runtimeOnly project(':platform-storage-s3')
    runtimeOnly project(':platform-storage-oss')
    runtimeOnly project(':platform-storage-cos')
    // Preserve the existing explicit scheduler opt-in for this compatibility slice.
    if (providers.gradleProperty('withSchedulerXxl').isPresent()) {
        runtimeOnly project(':platform-scheduler-xxl')
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
springBoot {
    mainClass = 'com.auraboot.framework.application.PlatformApplication'
}
jar {
    enabled = false
}
bootJar {
    archiveFileName = "AuraBoot-${project.version}-boot.jar"
}
bootRun {
    // Preserve the established timezone, heap and pinned-HTTP Host-header settings.
    jvmArgs = rootProject.tasks.named('bootRun').get().jvmArgs
}

// Verify actual artifacts, not source text or merely the existence of empty modules.
tasks.register('verifyApplicationAssembly') {
    group = 'verification'
    description = 'Verify the full AI application and core/provider artifact ownership for S2.1'
    dependsOn 'bootJar', ':jar', ':generatePomFileForMavenJavaPublication'
    inputs.file tasks.named('bootJar').flatMap { it.archiveFile }
    inputs.file rootProject.tasks.named('jar').flatMap { it.archiveFile }
    inputs.file rootProject.layout.buildDirectory.file('publications/mavenJava/pom-default.xml')
    doLast {
        def forbidden = [':platform-app', ':platform-agent', ':platform-mq-kafka',
                         ':platform-storage-minio', ':platform-storage-s3',
                         ':platform-storage-oss', ':platform-storage-cos', ':platform-scheduler-xxl']
        def backEdges = rootProject.configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                .collect { it.id }.findAll { it instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }
                .findAll { it.projectPath in forbidden }
        if (!backEdges.empty) {
            throw new GradleException("Core runtime includes implementation projects: ${backEdges*.projectPath}")
        }
        def pom = new groovy.xml.XmlSlurper().parse(
                rootProject.layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile)
        def publishedBackEdges = pom.dependencies.dependency.artifactId*.text()
                .findAll { ":${it}" in forbidden }
        if (!publishedBackEdges.empty) {
            throw new GradleException("Core POM includes implementation dependencies: ${publishedBackEdges}")
        }
        def application = tasks.named('bootJar').get().archiveFile.get().asFile
        new ZipFile(application).withCloseable { zip ->
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('Start-Class') != springBoot.mainClass.get()) {
                throw new GradleException('Application entrypoint does not belong to app')
            }
            if (zip.getEntry('BOOT-INF/classes/com/auraboot/framework/application/PlatformApplication.class') == null) {
                throw new GradleException('Application launcher is missing')
            }
            def libraries = zip.entries().findAll { it.name.startsWith('BOOT-INF/lib/') }*.name
            ['platform-mq-kafka', 'platform-storage-minio', 'platform-storage-s3',
             'platform-storage-oss', 'platform-storage-cos'].each { name ->
                if (libraries.count { it.startsWith("BOOT-INF/lib/${name}-") } != 1) {
                    throw new GradleException("Full application must contain exactly one ${name}")
                }
            }
            if (!providers.gradleProperty('withSchedulerXxl').isPresent()
                    && libraries.any { it.contains('xxl-job') || it.contains('platform-scheduler-xxl') }) {
                throw new GradleException('Default application includes opt-in scheduler')
            }
        }
        new ZipFile(rootProject.tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
            if (zip.getEntry('com/auraboot/framework/application/PlatformApplication.class') != null) {
                throw new GradleException('Application launcher leaked into core')
            }
            // S2.1 must preserve AI; the physical extraction is deliberately S2.2.
            if (zip.getEntry('com/auraboot/framework/agent/provider/LlmProviderFactory.class') == null) {
                throw new GradleException('Existing AI implementation was lost during preparation')
            }
        }
    }
}
check {
    dependsOn 'verifyApplicationAssembly'
}
