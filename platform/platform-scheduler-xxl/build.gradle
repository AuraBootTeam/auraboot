plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.auraboot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    // Platform core (SchedulerEngine, ScheduledTaskMapper, task payload types)
    compileOnly project(':')

    // Spring Boot (conditional annotations, configuration properties)
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.5.16'
    compileOnly 'org.springframework:spring-beans:6.2.19'
    compileOnly 'org.springframework:spring-context:6.2.19'
    compileOnly 'org.springframework:spring-web:6.2.19'

    // SLF4J for @Slf4j
    compileOnly 'org.slf4j:slf4j-api:2.0.20'

    // Lifecycle annotations (@PreDestroy) and MyBatis-Plus mapper types
    // (ScheduledTaskMapper extends BaseMapper, whose signatures appear in this module)
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    compileOnly 'com.baomidou:mybatis-plus-annotation:3.5.16'
    compileOnly 'com.baomidou:mybatis-plus-core:3.5.16'

    // XXL-JOB executor/admin client.
    // LICENSE NOTE: xxl-job-core is distributed under GPL-3.0. This module is
    // deliberately NOT part of the default AuraBoot bootJar. Adding it to a
    // distribution makes the combined work subject to GPL-3.0; review the
    // AuraBoot License FAQ before shipping it commercially.
    implementation 'com.xuxueli:xxl-job-core:3.4.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Test against root platform classes only; avoid pulling the full root runtime graph
    testImplementation(project(':')) {
        transitive = false
    }
    testImplementation 'org.springframework:spring-beans:6.2.19'
    testImplementation 'org.springframework.boot:spring-boot:3.5.16'
    testImplementation 'org.slf4j:slf4j-api:2.0.20'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    testImplementation 'com.baomidou:mybatis-plus-annotation:3.5.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // ConditionalOnProperty / ConditionalOnMissingBean must be on the test
    // RUNTIME classpath: an absent annotation type is silently ignored by the
    // JVM, which would make every @Bean in the configuration unconditional.
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure:3.5.16'
    testImplementation 'org.springframework.boot:spring-boot-test:3.5.16'
    testImplementation 'org.springframework:spring-test:6.2.19'
    testImplementation 'org.springframework:spring-context:6.2.19'
    testImplementation 'org.springframework:spring-web:6.2.19'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'com.baomidou:mybatis-plus-core:3.5.16'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'platform-scheduler-xxl'
        }
    }

    repositories {
        mavenLocal()
    }
}
