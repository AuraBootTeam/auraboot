plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.auraboot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

dependencies {
    compileOnly project(':')  // Platform core (StorageProvider, StorageProperties, StorageType)

    // AWS SDK v2
    implementation platform('software.amazon.awssdk:bom:2.57.2')
    implementation 'software.amazon.awssdk:s3'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Spring conditional
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:4.1.2'
    compileOnly 'org.springframework:spring-context:7.0.10'

    // Test — depend on root project classes only (no transitive deps)
    testImplementation(project(':')) {
        transitive = false
    }
    testImplementation(project(':platform-plugin-api')) {
        transitive = false
    }
    testImplementation 'org.springframework:spring-beans:7.0.10'  // DisposableBean
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure:4.1.2'  // @ConditionalOnProperty
    testImplementation 'org.springframework:spring-context:7.0.10'  // @Component
    testImplementation 'com.baomidou:mybatis-plus-annotation:3.5.18.1'  // @EnumValue
    testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'  // @JsonValue
    testImplementation 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'platform-storage-s3'
            // Publish the concrete AWS SDK version selected by the producer's BOM.
            versionMapping {
                usage('java-api') { fromResolutionOf('runtimeClasspath') }
                usage('java-runtime') { fromResolutionResult() }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}
