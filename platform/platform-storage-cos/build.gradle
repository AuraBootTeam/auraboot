plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.auraboot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    // Platform core (StorageProvider, StorageProperties, StorageType)
    compileOnly project(':')

    // Tencent official COS Java SDK: https://cloud.tencent.com/document/product/436/10199
    implementation('com.qcloud:cos_api:5.6.283') {
        // One maintained JDK 18+ provider on Java 21; the legacy JDK 15 jar
        // otherwise shadows the patched provider through duplicate classes.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    runtimeOnly 'org.bouncycastle:bcprov-jdk18on:1.85'
    // Align the adapter tests and published runtime with the app SDK policy.
    implementation "com.tencentcloudapi:tencentcloud-sdk-java-kms:${rootProject.tencentCloudSdkVersion}"
    constraints {
        implementation "org.apache.commons:commons-configuration2:${rootProject.commonsConfigurationVersion}"
        implementation "org.apache.commons:commons-lang3:${rootProject.commonsLangVersion}"
        implementation "org.apache.commons:commons-text:${rootProject.commonsTextVersion}"
    }

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Spring Boot (conditional annotations, lifecycle interfaces)
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:4.1.2'
    compileOnly 'org.springframework:spring-beans:7.0.10'
    compileOnly 'org.springframework:spring-context:7.0.10'

    // SLF4J for @Slf4j
    compileOnly 'org.slf4j:slf4j-api:2.0.20'

    // Test — platform classes and Spring needed at test runtime too
    testImplementation(project(':')) {
        transitive = false
    }
    testImplementation 'org.springframework:spring-beans:7.0.10'
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure:4.1.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

test {
    useJUnitPlatform()
    exclude '**/*IT.class'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'platform-storage-cos'
        }
    }

    repositories {
        mavenLocal()
    }
}

// Explicit read-only cloud receipt; default unit tests never touch COS.
tasks.register('cosAclCheck', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/CosAclIT.class'
    doFirst {
        if (providers.gradleProperty('cosAclReadOnly').orNull != 'true') throw new GradleException('Explicit -PcosAclReadOnly=true required')
        def config = providers.gradleProperty('cosAclPrivateFile').orNull
        def receipt = providers.gradleProperty('cosAclReceipt').orNull
        if (!config || !file(config).isFile() || !receipt) throw new GradleException('Private config file and sanitized receipt path required')
        systemProperty 'cos.acl.private.file', config
        systemProperty 'cos.acl.receipt', receipt
    }
}
