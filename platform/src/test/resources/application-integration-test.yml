# Device Model Integration Test Configuration

spring:
  # Redis configuration for test (match host redis at 6379)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
  # 数据源配置 - 使用实际数据库
  datasource:
    # A release gate must be able to point the suite at a freshly migrated,
    # isolated database instead of inheriting mutable developer state.
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/aura_boot?charSet=UTF8}
    username: ${TEST_DATABASE_USERNAME:ghj}
    password: ${TEST_DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none  # 不修改数据库结构，使用现有表
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

# Git配置 - 测试环境禁用调度任务
aura:
  plugins:
    temp:
      dir: /tmp/aura-plugins-test
    signature:
      enforce: false
  git:
    repos:
      base-path: ${java.io.tmpdir}/aura-test-repos  # 使用临时目录
    scheduler:
      enabled: false  # 测试环境禁用调度任务
      
# MyBatis Plus配置
mybatis-plus:
  configuration:
    # 不要在此打开 log-impl: StdOutImpl —— 它把每条 SQL 的全行结果直写 stdout,
    # 真实库集成测试单次即可产生 GB 级 JUnit 报告(2026-10 实测单文件 5.2G)。
    # 临时排查 SQL 时请本地改完即还原,或用 JUnit 的 @SpringBootTest(properties=...) 按测试类覆盖。
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deletedFlag
      logic-delete-value: true
      logic-not-delete-value: false
  mapper-locations: classpath*:mybatis/sqlmap/*.xml
      
# 应用配置
auraboot:
  # 租户配置
  tenant:
    enabled: true
    default-tenant-id: tenant_integration_test
    
  # 权限配置
  permission:
    cache-enabled: true
    cache-ttl: 1800  # 30分钟
    
  # 字典配置
  dict:
    cache-enabled: true
    cache-ttl: 3600  # 1小时
    
  # 查询配置
  query:
    sql-injection-check: true
    max-result-size: 10000
    timeout: 30000  # 30秒

# Integration tests opt into the deterministic stub LLM explicitly. Production
# application.yml leaves the key blank by default so missing credentials fail
# closed instead of silently routing real traffic to stub.
agent:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:stub_key_for_no_llm_paths}

# 安全配置
security:
  jwt:
    secret: your_very_long_and_secure_secret_key_at_least_32_chars
    expiration: 86400
  password:
    require-uppercase: false
    require-special: false

# 雪花ID配置
snowflake:
  worker-id: 1      # 工作机器ID (0-31)
  datacenter-id: 1  # 数据中心ID (0-31)

# 数据库ID类型配置
database:
  id-type: long
    
# 日志配置
# 注意:DEBUG 级别在真实库集成测试里会把租户拦截器的每条 SQL 解析、MyBatis 的
# SqlSession 获取/释放逐条写入 JUnit 报告,单次运行可膨胀到 GB 级(2026-10 实测)。
# 排查时用 @SpringBootTest(properties="logging.level.com.auraboot.framework=DEBUG")
# 按测试类临时覆盖,不要把 DEBUG 提交回这里。
logging:
  level:
    com.auraboot.framework: INFO
    org.springframework.security: INFO
    org.springframework.cache: INFO
    org.mybatis: INFO
    
# 测试专用配置
test:
  # 测试数据配置
  data:
    cleanup-after-test: false  # 测试后不清理数据，便于验证
    create-sample-data: true   # 创建示例数据
    
  # 性能测试配置
  performance:
    large-dataset-size: 1000
    concurrent-threads: 10
    query-timeout: 5000
