# ArchUnit configuration
# Gradle seeds a task-specific build store from the committed archunit_store baseline.
# The fallback also stays outside tracked source; non-Gradle runners must seed it explicitly.
freeze.store.default.path=build/archunit-stores/test
# A missing store must fail instead of creating a baseline implicitly.
freeze.store.default.allowStoreCreation=false
# Allow resolved violations to disappear from the disposable task copy.
freeze.store.default.allowStoreUpdate=true
